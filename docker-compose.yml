services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml
    environment:
      - MTX_PATHS_CAM01_SOURCE=${CAM01_SOURCE}
      - MTX_PATHS_CAM02_SOURCE=${CAM02_SOURCE}
      - MTX_PATHS_CAM03_SOURCE=${CAM03_SOURCE}
    labels:
      - traefik.enable=true
      - traefik.http.routers.mediamtx-cam01.rule=Host(`cam01.wenger.dev`)
      - traefik.http.routers.mediamtx-cam01.entryPoints=https
      - traefik.http.routers.mediamtx-cam01.tls=true
      - traefik.http.routers.mediamtx-cam01.tls.certresolver=cloudflare
      - traefik.http.routers.mediamtx-cam01.service=mediamtx-cam01
      - traefik.http.services.mediamtx-cam01.loadbalancer.server.port=8888
      - traefik.http.middlewares.mediamtx-cam01.replacepathregex.regex=^/(?:cam01/)?(.*)
      - traefik.http.middlewares.mediamtx-cam01.replacepathregex.replacement=/cam01/$$1
      - traefik.http.routers.mediamtx-cam01.middlewares=authelia@docker,mediamtx-cam01

      - traefik.http.routers.mediamtx-cam02.rule=Host(`cam02.wenger.dev`)
      - traefik.http.routers.mediamtx-cam02.entryPoints=https
      - traefik.http.routers.mediamtx-cam02.tls=true
      - traefik.http.routers.mediamtx-cam02.tls.certresolver=cloudflare
      - traefik.http.routers.mediamtx-cam02.service=mediamtx-cam02
      - traefik.http.services.mediamtx-cam02.loadbalancer.server.port=8888
      - traefik.http.middlewares.mediamtx-cam02.replacepathregex.regex=^/(?:cam02/)?(.*)
      - traefik.http.middlewares.mediamtx-cam02.replacepathregex.replacement=/cam02/$$1
      - traefik.http.routers.mediamtx-cam02.middlewares=authelia@docker,mediamtx-cam02

      - traefik.http.routers.mediamtx-cam03.rule=Host(`cam03.wenger.dev`)
      - traefik.http.routers.mediamtx-cam03.entryPoints=https
      - traefik.http.routers.mediamtx-cam03.tls=true
      - traefik.http.routers.mediamtx-cam03.tls.certresolver=cloudflare
      - traefik.http.routers.mediamtx-cam03.service=mediamtx-cam03
      - traefik.http.services.mediamtx-cam03.loadbalancer.server.port=8888
      - traefik.http.middlewares.mediamtx-cam03.replacepathregex.regex=^/(?:cam03/)?(.*)
      - traefik.http.middlewares.mediamtx-cam03.replacepathregex.replacement=/cam03/$$1
      - traefik.http.routers.mediamtx-cam03.middlewares=authelia@docker,mediamtx-cam03

      - traefik.http.routers.mediamtx-moq.rule=Host(`cams.wenger.dev`)
      - traefik.http.routers.mediamtx-moq.entryPoints=https
      - traefik.http.routers.mediamtx-moq.tls=true
      - traefik.http.routers.mediamtx-moq.tls.certresolver=cloudflare
      - traefik.http.routers.mediamtx-moq.service=mediamtx-moq
      - traefik.http.services.mediamtx-moq.loadbalancer.server.port=8892
      - traefik.http.services.mediamtx-moq.loadbalancer.server.scheme=https
      - traefik.http.middlewares.mediamtx-moq-root.redirectregex.regex=^https://cams\.wenger\.dev/$$
      - traefik.http.middlewares.mediamtx-moq-root.redirectregex.replacement=https://cams.wenger.dev/cam01/
      - traefik.http.middlewares.mediamtx-moq-root.redirectregex.permanent=true
      - traefik.http.routers.mediamtx-moq.middlewares=mediamtx-moq-root

      - traefik.udp.routers.mediamtx-moq.entryPoints=https-udp
      - traefik.udp.routers.mediamtx-moq.service=mediamtx-moq-udp
      - traefik.udp.services.mediamtx-moq-udp.loadbalancer.server.port=8892

networks:
  default:
    external: true
    name: private
